<!doctype html>
<html lang="cs" data-mode="studio">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Veronika — weby, portfolia, SaaS frontend" />
    <meta
      property="og:description"
      content="Weby, které vypadají jako vy a fungují. Záchrana CMS, Lovable → produkce. Frontend/product developer s 8+ lety v SaaS."
    />
    <meta
      name="description"
      content="Veronika — vývojářka. Weby a portfolia pro lidi a značky, záchrana CMS, převod Lovable prototypů do produkce."
    />
    <meta name="theme-color" content="#f7f3ec" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <title>Veronika</title>
  </head>
  <body>
    <!-- Netlify Forms detects this static form at deploy time. The React sheet posts to it. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="mode" />
      <input type="text" name="language" />
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
